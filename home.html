<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Issue Tracker | Home</title>
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />
    <!-- tailwind + daisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      class="navbar bg-base-100 shadow-sm px-4 sm:px-6 md:px-10 flex flex-col sm:flex-row sm:justify-between gap-3 py-3"
    >
      <div
        class="flex items-center w-full sm:w-auto justify-center sm:justify-start"
      >
        <img src="./assets/github-logo.png" alt="" class="w-8 sm:w-10" />
        <a class="btn btn-ghost text-base sm:text-xl whitespace-nowrap"
          >GitHub Issues Tracker</a
        >
      </div>

      <div class="flex gap-2 w-full sm:w-auto">
        <input
          id="input_text"
          type="text"
          placeholder="Search for issues..."
          class="input input-bordered flex-1 sm:w-64 md:w-auto"
        />
        <button class="search_btn btn btn-primary px-6 sm:px-4">Search</button>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
