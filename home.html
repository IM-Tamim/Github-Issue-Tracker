<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Issue Tracker | Home</title>
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />
    <!-- tailwind + daisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body class="bg-base-200">
    <!-- Navbar -->
    <div
      class="navbar bg-base-100 shadow-sm px-4 sm:px-6 md:px-10 flex flex-col sm:flex-row sm:justify-between gap-3 py-3"
    >
      <div
        class="flex items-center w-full sm:w-auto justify-center sm:justify-start"
      >
        <img src="./assets/github-logo.png" alt="" class="w-8 sm:w-10" />
        <a class="btn btn-ghost text-base sm:text-xl whitespace-nowrap"
          >GitHub Issues Tracker</a
        >
      </div>

      <div class="flex gap-2 w-full sm:w-auto">
        <input
          id="input_text"
          type="text"
          placeholder="Search for issues..."
          class="input input-bordered flex-1 sm:w-64 md:w-auto"
        />
        <button class="search_btn btn btn-primary px-6 sm:px-4">Search</button>
      </div>
    </div>

    <main class="container py-12">
      <section class="max-w-9/12 mx-auto">
        <div class="flex gap-2 bg-base-100 p-6 rounded-lg">
          <button id="all-btn" class="btn btn-primary md:w-30">All</button>
          <button id="open-btn" class="btn btn-primary md:w-30">Open</button>
          <button id="close-btn" class="btn btn-primary md:w-30">Close</button>
        </div>
        <div class="bg-base-100 p-6 mt-3 rounded-lg">
          <div class="flex justify-between items-center flex-col md:flex-row">
            <div class="flex gap-2 items-center">
              <div
                class="bg-purple-100 p-2 rounded-full w-10 h-10 flex items-center justify-center"
              >
                <img src="./assets/Aperture.png" alt="" class="w-5 h-5" />
              </div>
              <div>
                <h2 class="text-lg font-bold">
                  <span id="all-count">0</span> Issues
                </h2>
                <p>Track and manage your project issues</p>
              </div>
            </div>
            <div class="flex gap-3 pt-3">
              <div class="flex gap-1 items-center">
                <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                <p>Open</p>
              </div>
              <div class="flex gap-1 items-center">
                <div class="w-3 h-3 bg-purple-500 rounded-full"></div>
                <p>Closed</p>
              </div>
            </div>
          </div>
          <hr class="text-gray-200 my-5" />
          <div id="card-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
          </div>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
